name: Verify action

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SECEX_EGRESS_RULES: "github.a8c.com,github.com,api.github.com,raw.githubusercontent.com,objects.githubusercontent.com,release-assets.githubusercontent.com,nodejs.org,registry.npmjs.org"

jobs:
  verify:
    runs-on: ${{ fromJSON(github.server_url == 'https://github.com' && '["ubuntu-latest"]' || '["self-hosted","secex","gha-runner-2cpu-2gb"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - run: git diff --exit-code -- dist
